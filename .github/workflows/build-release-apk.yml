name: Build Android Release APKs

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Restore signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/release.jks

      - name: Build GitHub phone and Wear release APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleGithubRelease :wear:assembleRelease

      - name: Verify and name release APKs
        run: |
          PHONE_APK="app/build/outputs/apk/github/release/app-github-release.apk"
          WEAR_APK="wear/build/outputs/apk/release/wear-release.apk"
          if [ ! -f "$PHONE_APK" ]; then
            echo "::error::Missing GitHub phone APK at $PHONE_APK"
            exit 1
          fi
          if [ ! -f "$WEAR_APK" ]; then
            echo "::error::Missing Wear APK at $WEAR_APK"
            exit 1
          fi
          cp "$PHONE_APK" "WorkoutTracker-${{ github.event.release.tag_name }}.apk"
          cp "$WEAR_APK" "WorkoutTracker-Wear-${{ github.event.release.tag_name }}.apk"

      - name: Upload APKs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ github.event.release.tag_name }}" \
            "WorkoutTracker-${{ github.event.release.tag_name }}.apk" \
            "WorkoutTracker-Wear-${{ github.event.release.tag_name }}.apk" \
            --clobber
