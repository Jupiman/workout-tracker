name: Build Android Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Restore signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/release.jks

      - name: Build signed release APKs and Play AABs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleGithubRelease :wear:assembleRelease :app:bundlePlayRelease :wear:bundleRelease

      - name: Verify and name release APKs
        run: |
          PHONE_APK="app/build/outputs/apk/github/release/app-github-release.apk"
          WEAR_APK="wear/build/outputs/apk/release/wear-release.apk"
          if [ ! -f "$PHONE_APK" ]; then
            echo "::error::Missing GitHub phone APK at $PHONE_APK"
            exit 1
          fi
          if [ ! -f "$WEAR_APK" ]; then
            echo "::error::Missing Wear APK at $WEAR_APK"
            exit 1
          fi
          cp "$PHONE_APK" "WorkoutTracker-${{ github.event.release.tag_name }}.apk"
          cp "$WEAR_APK" "WorkoutTracker-Wear-${{ github.event.release.tag_name }}.apk"

      - name: Verify and name Play AABs
        run: |
          PHONE_AAB="app/build/outputs/bundle/playRelease/app-play-release.aab"
          WEAR_AAB="wear/build/outputs/bundle/release/wear-release.aab"
          if [ ! -f "$PHONE_AAB" ]; then
            echo "::error::Missing Play phone AAB at $PHONE_AAB"
            exit 1
          fi
          if [ ! -f "$WEAR_AAB" ]; then
            echo "::error::Missing Wear AAB at $WEAR_AAB"
            exit 1
          fi
          cp "$PHONE_AAB" "WorkoutTracker-Play-${{ github.event.release.tag_name }}.aab"
          cp "$WEAR_AAB" "WorkoutTracker-Wear-Play-${{ github.event.release.tag_name }}.aab"

      - name: Store Play AABs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-aabs-${{ github.event.release.tag_name }}
          path: |
            WorkoutTracker-Play-${{ github.event.release.tag_name }}.aab
            WorkoutTracker-Wear-Play-${{ github.event.release.tag_name }}.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload APKs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ github.event.release.tag_name }}" \
            "WorkoutTracker-${{ github.event.release.tag_name }}.apk" \
            "WorkoutTracker-Wear-${{ github.event.release.tag_name }}.apk" \
            --clobber
